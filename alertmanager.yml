global:
  resolve_timeout: 5m

route:
  receiver: "slack-default"
  group_by: ["category"]
  group_wait: 10s
  group_interval: 2m
  repeat_interval: 30m

  routes:
    # Infra alerts (CPU, Memory, Disk)
    - match:
        category: infra
      receiver: "slack-infra"
      group_by: ["alertname", "instance", "mountpoint"]

    # App alerts
    - match:
        category: app
      receiver: "slack-app"
      group_by: ["alertname","job"]

receivers:
  - name: "slack-default"
    slack_configs:
      - api_url: "https://hooks.slack.com/services/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"
        channel: "#ops-alert"
        send_resolved: true
        title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
        text: "{{ .CommonAnnotations.summary }}"

  - name: "slack-infra"
    slack_configs:
      - api_url: "https://hooks.slack.com/services/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"
        channel: "#ops-alert"
        send_resolved: true
        title: "[INFRA] {{ .CommonLabels.alertname }}"
        text: >-
          {{ range .Alerts -}}
          🖥️ *Infra Alert*
          *Alert:* {{ .Annotations.summary }}
          *Severity:* {{ .Labels.severity }}
          *Description:* {{ .Annotations.description }}
          *Instance:* {{ .Labels.instance }}
          {{- if .Labels.mountpoint }}
          *Mount:* {{ .Labels.mountpoint }}
          {{- end }}
          {{ end }}

  - name: "slack-app"
    slack_configs:
      - api_url: "https://hooks.slack.com/services/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"
        channel: "#ops-alert"
        send_resolved: true
        title: "[APP] {{ .CommonLabels.alertname }}"
        text: >-
          {{ range .Alerts -}}
          🚀 *App Alert*
          *Alert:* {{ .Annotations.summary }}
          *Severity:* {{ .Labels.severity }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

