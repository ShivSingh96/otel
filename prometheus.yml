global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "otel-collector-prom-exporter"
    static_configs:
      - targets: ["otel-collector:9464"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["172.31.8.188:9100"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]